<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIS 人才求职市场看板</title>
  <script>
    window.__errs = [];
    window.addEventListener('error', (e) => window.__errs.push(e.message + ' @ ' + e.filename + ':' + e.lineno));
    window.addEventListener('unhandledrejection', (e) => window.__errs.push('REJ: ' + ((e.reason && e.reason.stack) || e.reason)));
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <!-- Inter（Claude 所用 Styrene 为商用字体，Inter 是最接近的免费近似；jsDelivr 在国内可达，失败时回落到系统字体） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.3.0/index.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.3.0/500.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.3.0/600.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.3.0/700.css" />
  <title>GIS 人才求职市场看板</title>
  <script>
    window.__errs = [];
    window.addEventListener('error', (e) => window.__errs.push(e.message + ' @ ' + e.filename + ':' + e.lineno));
    window.addEventListener('unhandledrejection', (e) => window.__errs.push('REJ: ' + ((e.reason && e.reason.stack) || e.reason)));
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
